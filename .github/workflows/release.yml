name: Release

on:
  push:
    branches: [main]

# Only one release at a time, and never cancel a half-finished publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest

    # Skip the release commit that @semantic-release/git pushes back to main,
    # belt-and-braces alongside its own "[skip ci]" tag.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write # create tags, releases, and push the changelog commit
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs full history and tags to work out the
          # previous version.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-run the same gates as CI so a broken commit can never be released.
      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm exec semantic-release
